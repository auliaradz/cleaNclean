<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 42 700 700" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gOuter" gradientUnits="userSpaceOnUse" x1="90" y1="70" x2="430" y2="720">
      <stop offset="0" stop-color="#38EBA4"/>
      <stop offset="0.32" stop-color="#27D0C6"/>
      <stop offset="0.68" stop-color="#2AA2EE"/>
      <stop offset="1" stop-color="#2F8DF3"/>
    </linearGradient>
    <linearGradient id="gInner" gradientUnits="userSpaceOnUse" x1="200" y1="115" x2="450" y2="680">
      <stop offset="0" stop-color="#22BDF2"/>
      <stop offset="0.45" stop-color="#1F8AE8"/>
      <stop offset="1" stop-color="#1B55D3"/>
    </linearGradient>
    <linearGradient id="gHandle" x1="-27" y1="0" x2="27" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BF0D2"/>
      <stop offset="0.45" stop-color="#2FCFC8"/>
      <stop offset="1" stop-color="#1F8CDD"/>
    </linearGradient>
    <linearGradient id="gHandleLen" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A3C9C" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="gFerrule" x1="0" y1="322" x2="0" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46E6D2"/>
      <stop offset="0.5" stop-color="#27B5D6"/>
      <stop offset="1" stop-color="#1C7FE0"/>
    </linearGradient>
    <linearGradient id="gBristle" x1="0" y1="392" x2="-40" y2="545" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EEF4FD"/>
      <stop offset="1" stop-color="#C6D7F0"/>
    </linearGradient>
    <clipPath id="clipShield"><path d="M355,66 C300,108 190,142 108,148 Q90,149 90,168 L90,420 C90,545 200,650 355,718 C510,650 625,545 625,420 L625,168 Q625,149 607,148 C520,142 410,108 355,66 Z"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/><feColorMatrix type="matrix" values="0 0 0 0 0.01  0 0 0 0 0.09  0 0 0 0 0.28  0 0 0 1 0"/>
    </filter>
    <g id="spark">
      <path d="M0,-1 Q0.13,-0.13 1,0 Q0.13,0.13 0,1 Q-0.13,0.13 -1,0 Q-0.13,-0.13 0,-1 Z" fill="#FFFFFF"/>
    </g>
    <!-- sapu, digambar tegak: pangkal gagang di (0,0), mengarah ke bawah -->
    <g id="broom">
      <!-- bulu -->
      <path d="M-66,388 L66,388 C80,440 108,492 124,536
               Q100,526 86,500 Q88,544 58,558 Q40,540 24,512
               Q22,550 -18,560 Q-44,540 -60,508 Q-72,548 -114,552
               Q-120,530 -122,514 Q-138,530 -164,534
               C-132,498 -96,446 -66,388 Z"
            fill="url(#gBristle)" stroke="#0C2D63" stroke-width="9" stroke-linejoin="round"/>
      <g fill="none" stroke="#AFC4E6" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M34,396 C52,440 76,476 86,500"/>
        <path d="M0,396 C6,440 18,482 24,512"/>
        <path d="M-34,396 C-40,440 -52,482 -60,508"/>
        <path d="M-58,402 C-84,450 -112,490 -122,514"/>
      </g>
      <!-- gagang -->
      <path d="M-27,0 A27,27 0 0 1 27,0 L25,262 C25,292 58,296 62,326 L-62,326 C-58,296 -25,292 -25,262 Z"
            fill="url(#gHandle)" stroke="#0C2D63" stroke-width="9" stroke-linejoin="round"/>
      <path d="M-27,0 A27,27 0 0 1 27,0 L25,262 C25,292 58,296 62,326 L-62,326 C-58,296 -25,292 -25,262 Z"
            fill="url(#gHandleLen)"/>
      <path d="M-17,10 L-17,255" stroke="#9DF7E4" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
      <circle cx="0" cy="1" r="9.5" fill="#0C2D63"/>
      <!-- ferrule -->
      <rect x="-70" y="322" width="140" height="70" rx="9" fill="url(#gFerrule)" stroke="#0C2D63" stroke-width="9" stroke-linejoin="round"/>
      <rect x="-60" y="330" width="120" height="16" rx="6" fill="#B6FFF0" opacity="0.42"/>
      <path d="M-66,362 L66,362" stroke="#1566C8" stroke-width="5" opacity="0.7"/>
    </g>
  </defs>

  <!-- perisai -->
  <path id="shieldOuter" d="M355,66 C300,108 190,142 108,148 Q90,149 90,168 L90,420 C90,545 200,650 355,718
           C510,650 625,545 625,420 L625,168 Q625,149 607,148 C520,142 410,108 355,66 Z"
        fill="url(#gOuter)"/>
  <path id="shieldInner" d="M355,112 C305,148 215,176 148,182 Q134,183 134,198 L134,420 C134,525 225,615 355,672
           C485,615 580,525 580,420 L580,198 Q580,183 566,182 C495,176 405,148 355,112 Z"
        fill="url(#gInner)"/>
  <path d="M355,112 L355,672 L355,672 C485,615 580,525 580,420 L580,198 Q580,183 566,182 C495,176 405,148 355,112 Z"
        fill="#0A2E8A" opacity="0.10"/>
  <path d="M355,112 C305,148 215,176 148,182 Q134,183 134,198 L134,420 C134,525 225,615 355,672
           C485,615 580,525 580,420 L580,198 Q580,183 566,182 C495,176 405,148 355,112 Z"
        fill="none" stroke="#6FD6FF" stroke-width="3" opacity="0.55"/>

  <!-- kilau -->
  <use href="#spark" transform="translate(245,266) scale(50 56)"/>
  <use href="#spark" transform="translate(352,217) scale(32)"/>
  <use href="#spark" transform="translate(518,406) scale(33)"/>
  <use href="#spark" transform="translate(458,521) scale(37)"/>

  <!-- bayangan sapu -->
  <g clip-path="url(#clipShield)"><use href="#broom" transform="translate(612,146) rotate(43)" opacity="0.35" filter="url(#soft)"/></g>
  <!-- sapu -->
  <use href="#broom" transform="translate(600,133) rotate(43)"/>
</svg>
